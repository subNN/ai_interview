[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-assistant"
version = "1.1.0"
description = "Windows desktop interview assistant with a floating answer overlay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.8,<7",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyaudiowpatch>=0.2.12",
    "websocket-client>=1.8.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "keyring>=25.0.0",
    "pdfplumber>=0.11.0",
    "faster-whisper>=1.0.0",
    "pyttsx3>=2.90",
]

[project.scripts]
ai-interview-assistant = "interview_assistant.app:run"

[tool.setuptools]
packages = ["interview_assistant", "interview_assistant.core", "interview_assistant.platform", "interview_assistant.ui"]